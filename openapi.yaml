openapi: 3.1.0
info:
  title: Домовой — API приложения дома в MAX
  version: 1.0.0
  description: 'API мини-приложения и бота MAX «Домовой»: вход по QR-коду квитанции, обращения в УК, начисления,
    счётчики, лента и опросы дома, раздел председателя, кабинет УК, подбор дома.


    **Как войти для проверки.** Без квитанции и без MAX — ролью демо-дома: `POST /api/demo/roles/{key}/take` (key:
    chairman, owner12, member12, owner45, owner78, newcomer30) вернёт `token`; дальше заголовок `Authorization:
    Bearer <token>`. Кабинет УК — `POST /api/dispatcher/login` с логином демо-УК (пароль — на служебном слайде презентации),
    тоже `token`.


    **Ошибки** — JSON `{ "error": "код", "message": "текст для человека" }`.


    **Модель доступа.** Квитанция — заявка, а не пропуск: новая квартира приходит со статусом `pending`. Уровень
    0 (pending) — свои начисления, счётчики и обращения в УК сразу. Уровень 1 (active) — соседи, лента, опросы.
    Уровень 2 — дом целиком, только председателю. Обращение удалить нельзя.


    Кабинет оператора (`/api/admin/*`) — внутренний и здесь не описан.'
servers:
- url: https://domovoy.devcore.com.ru
  description: Бой
- url: http://localhost:3000
  description: Локальный запуск (docker compose)
tags:
- name: Служебное
- name: Вход
- name: Житель
- name: Обращения
- name: Дом
- name: Уведомления
- name: Председатель
- name: Кабинет УК
- name: Подбор дома
- name: Бот MAX
security:
- bearerAuth: []
- cookieAuth: []
paths:
  /api/address/houses:
    get:
      tags:
      - Вход
      summary: Дома улицы
      description: Список домов выбранной улицы из ГАР.
      operationId: get_api_address_houses
      parameters:
      - name: street
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                type: object
                properties:
                  houses:
                    type: array
                    items:
                      type: object
                      properties:
                        houseKey:
                          type:
                          - string
                          - 'null'
                        number:
                          type: string
                        address:
                          type:
                          - string
                          - 'null'
                      required:
                      - houseKey
                      - number
                      - address
                required:
                - houses
        '400':
          description: Неверные данные запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
  /api/address/streets:
    get:
      tags:
      - Вход
      summary: Подсказка улиц
      description: Поиск улицы по справочнику ГАР — для квитанции без адреса.
      operationId: get_api_address_streets
      parameters:
      - name: region
        in: query
        required: false
        schema:
          type: string
      - name: q
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                type: object
                properties:
                  streets:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type:
                          - string
                          - 'null'
                        name:
                          type:
                          - string
                          - 'null'
                        socr:
                          type:
                          - string
                          - 'null'
                        placeName:
                          type:
                          - string
                          - 'null'
                        placeSocr:
                          type:
                          - string
                          - 'null'
                        postalCode: {}
                        label:
                          type:
                          - string
                          - 'null'
                      required:
                      - code
                      - name
                      - socr
                      - placeName
                      - placeSocr
                      - postalCode
                      - label
                required:
                - streets
        '409':
          description: Конфликт состояния
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
  /api/assistant:
    post:
      tags:
      - Обращения
      summary: Спросить Домового
      description: 'Помощник в приложении: тот же разговор, что у бота MAX. GigaChat пишет ответ сам, но данные
        жителя получает только инструментами с правами приложения; суммы, номера, телефоны и даты в ответе сверяет
        код. Жалобу кладёт черновиком — отправляет житель из формы.'
      operationId: post_api_assistant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type:
                  - string
                  - 'null'
              required:
              - text
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                type: object
                properties:
                  replies:
                    type: array
                    items:
                      type: object
                      properties:
                        text:
                          type:
                          - string
                          - 'null'
                        buttons:
                          type: array
                          items:
                            type: array
                            items:
                              type: object
                              properties:
                                type:
                                  type:
                                  - string
                                  - 'null'
                                text:
                                  type:
                                  - string
                                  - 'null'
                                webApp:
                                  type:
                                  - string
                                  - 'null'
                                payload:
                                  type:
                                  - string
                                  - 'null'
                              required:
                              - type
                              - text
                        mood:
                          type:
                          - string
                          - 'null'
                        open:
                          description: Экран, который приложение открывает само (payload как у кнопки open_app, например s_meters)
                          type: string
                        ai:
                          description: Ответ написала модель — приложение показывает под ним пометку «Ответ сгенерирован ИИ»
                          type: boolean
                      required:
                      - text
                required:
                - replies
        '400':
          description: Неверные данные запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Нужен вход
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/auth/logout:
    post:
      tags:
      - Вход
      summary: Выход
      description: Гасит сессию и cookie.
      operationId: post_api_auth_logout
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                required:
                - status
      security: []
  /api/auth/max:
    post:
      tags:
      - Вход
      summary: Вход через MAX
      description: 'По подписи initData MAX. Если у аккаунта MAX ещё нет квартиры — needs_receipt: нужно отсканировать
        квитанцию.'
      operationId: post_api_auth_max
      parameters:
      - $ref: '#/components/parameters/MaxInitData'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                initData:
                  type:
                  - string
                  - 'null'
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  name:
                    type:
                    - string
                    - 'null'
                  startParam: {}
                  token:
                    type: string
                required:
                - status
        '401':
          description: Нужен вход
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
  /api/auth/phone:
    post:
      tags:
      - Вход
      summary: Сохранить телефон из MAX
      description: Телефон, полученный через requestContact MAX, с проверкой подписи.
      operationId: post_api_auth_phone
      parameters:
      - $ref: '#/components/parameters/MaxInitData'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type:
                  - string
                  - 'null'
                authDate:
                  type:
                  - string
                  - 'null'
                hash:
                  type:
                  - string
                  - 'null'
              required:
              - phone
              - authDate
              - hash
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  phone:
                    type:
                    - string
                    - 'null'
                required:
                - status
                - phone
        '400':
          description: Неверные данные запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/qr:
    post:
      tags:
      - Вход
      summary: Вход по QR-коду квитанции
      description: Строка QR (ГОСТ Р 56042) → житель и квартира. Любая новая привязка — со статусом pending (ждёт
        подтверждения председателя). В MAX передаётся заголовок X-Max-Init-Data, в браузере — без него (если включён
        вход из браузера). Возвращает токен сессии и ставит cookie.
      operationId: post_api_auth_qr
      parameters:
      - $ref: '#/components/parameters/MaxInitData'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                qr:
                  type:
                  - string
                  - 'null'
                address:
                  type: object
                  properties:
                    houseKey:
                      type:
                      - string
                      - 'null'
                    flat:
                      type:
                      - string
                      - 'null'
                    streetCode:
                      type:
                      - string
                      - 'null'
                    house:
                      type:
                      - string
                      - 'null'
                    block:
                      type:
                      - string
                      - 'null'
                    building:
                      type:
                      - string
                      - 'null'
                name:
                  type:
                  - string
                  - 'null'
                declaredPrivate:
                  type:
                  - boolean
                  - 'null'
              required:
              - qr
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  token:
                    type: string
                  firstTime:
                    type:
                    - boolean
                    - 'null'
                  role:
                    type:
                    - string
                    - 'null'
                  address:
                    type:
                    - string
                    - 'null'
                  persAcc:
                    type:
                    - string
                    - 'null'
                  uk:
                    type:
                    - string
                    - 'null'
                  period:
                    type:
                    - string
                    - 'null'
                  sum:
                    type:
                    - string
                    - 'null'
                required:
                - status
                - token
                - firstTime
                - role
                - address
                - persAcc
                - uk
                - period
                - sum
        '202':
          description: Ответ
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  token:
                    type: string
                  bindingId:
                    type:
                    - string
                    - 'null'
                  claimComplete:
                    type:
                    - boolean
                    - 'null'
                  hasChairman:
                    type:
                    - boolean
                    - 'null'
                  flat:
                    type:
                    - string
                    - 'null'
                  message:
                    type:
                    - string
                    - 'null'
                required:
                - status
                - token
                - bindingId
                - claimComplete
                - hasChairman
                - flat
                - message
        '400':
          description: Неверные данные запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Нет прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Конфликт состояния
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Слишком часто
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
      - cookieAuth: []
      - {}
  /api/bills/{billId}/paid:
    post:
      tags:
      - Житель
      summary: Отметить начисление оплаченным
      description: 'Отметка жителя: приложение не видит платёж, это его дневник.'
      operationId: post_api_bills_billId_paid
      parameters:
      - name: billId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: ok
                  billStatus:
                    type: string
                required:
                - status
                - billStatus
        '400':
          description: Неверные данные запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Нет прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                paid:
                  type: boolean
                kopecks:
                  type: integer
  /api/bills/{billId}/pay-qr:
    post:
      tags:
      - Житель
      summary: Ссылка на QR для оплаты
      description: Подписанная ссылка на картинку QR квитанции на 15 минут — только тому, кто принёс квитанцию.
      operationId: post_api_bills_billId_pay_qr
      parameters:
      - name: billId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: {}
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type:
                    - string
                    - 'null'
                  fileName:
                    type:
                    - string
                    - 'null'
                required:
                - url
                - fileName
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Нет прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/bills/{billId}/qr.png:
    get:
      tags:
      - Житель
      summary: Картинка QR квитанции
      description: По подписанной ссылке из pay-qr.
      operationId: get_api_bills_billId_qr_png
      parameters:
      - name: billId
        in: path
        required: true
        schema:
          type: string
      - name: t
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Успех
          content:
            image/png:
              schema:
                type: string
                format: binary
        '403':
          description: Нет прав
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
  /api/bot/drafts/{id}:
    get:
      tags:
      - Обращения
      summary: Черновик обращения от бота
      description: Текст и категория, которые бот MAX или Домовой подготовили по словам жителя.
      operationId: get_api_bot_drafts_id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                type: object
                properties:
                  propertyId:
                    type:
                    - string
                    - 'null'
                  category:
                    type:
                    - string
                    - 'null'
                  text:
                    type:
                    - string
                    - 'null'
                required:
                - propertyId
                - category
                - text
        '401':
          description: Нужен вход
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/chairman/claims:
    get:
      tags:
      - Председатель
      summary: Запросы на подтверждение
      description: Кто ждёт подтверждения квартиры, с расхождениями адреса.
      operationId: get_api_chairman_claims
      parameters:
      - name: houseKey
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: number
                  claims:
                    type: array
                    items:
                      type: object
                      properties:
                        bindingId:
                          type:
                          - string
                          - 'null'
                        propertyId:
                          type:
                          - string
                          - 'null'
                        houseKey:
                          type:
                          - string
                          - 'null'
                        address:
                          type:
                          - string
                          - 'null'
                        flat:
                          type:
                          - string
                          - 'null'
                        claimedFlat:
                          type:
                          - string
                          - 'null'
                        claimedName:
                          type:
                          - string
                          - 'null'
                        claimedPhone: {}
                        note:
                          type:
                          - string
                          - 'null'
                        accountName:
                          type:
                          - string
                          - 'null'
                        viaMax:
                          type:
                          - boolean
                          - 'null'
                        phoneVerified:
                          type:
                          - boolean
                          - 'null'
                        requestedAt:
                          type:
                          - string
                          - 'null'
                          format: date-time
                        complete:
                          type:
                          - boolean
                          - 'null'
                      required:
                      - bindingId
                      - propertyId
                      - houseKey
                      - address
                      - flat
                      - claimedFlat
                      - claimedName
                      - claimedPhone
                      - note
                      - accountName
                      - viaMax
                      - phoneVerified
                      - requestedAt
                      - complete
                required:
                - total
                - claims
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/chairman/claims/{id}/approve:
    post:
      tags:
      - Председатель
      summary: Подтвердить жителя
      description: 'Житель получает уровень 1: соседи, лента, опросы.'
      operationId: post_api_chairman_claims_id_approve
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type:
                  - string
                  - 'null'
                houseKey:
                  type:
                  - string
                  - 'null'
              required:
              - role
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  role:
                    type:
                    - string
                    - 'null'
                required:
                - status
                - role
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Конфликт состояния
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/chairman/claims/{id}/reject:
    post:
      tags:
      - Председатель
      summary: Отклонить запрос
      description: С причиной.
      operationId: post_api_chairman_claims_id_reject
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type:
                  - string
                  - 'null'
              required:
              - reason
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                required:
                - status
        '400':
          description: Неверные данные запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/chairman/contacts:
    get:
      tags:
      - Председатель
      summary: Телефоны дома
      operationId: get_api_chairman_contacts
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                type: object
                properties:
                  kinds:
                    type: array
                    items:
                      type: object
                      properties:
                        kind:
                          type:
                          - string
                          - 'null'
                        label:
                          type:
                          - string
                          - 'null'
                      required:
                      - kind
                      - label
                  contacts:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        kind:
                          type:
                          - string
                          - 'null'
                        title:
                          type:
                          - string
                          - 'null'
                        phone:
                          type:
                          - string
                          - 'null'
                        note: {}
                        updatedByRole:
                          type:
                          - string
                          - 'null'
                        updatedAt:
                          type:
                          - string
                          - 'null'
                          format: date-time
                      required:
                      - id
                      - kind
                      - title
                      - phone
                      - note
                      - updatedByRole
                      - updatedAt
                required:
                - kinds
                - contacts
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - Председатель
      summary: Добавить телефон дома
      operationId: post_api_chairman_contacts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                houseKey:
                  type:
                  - string
                  - 'null'
                kind:
                  type:
                  - string
                  - 'null'
                phone:
                  type:
                  - string
                  - 'null'
                note:
                  type:
                  - string
                  - 'null'
              required:
              - houseKey
              - kind
              - phone
              - note
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  id:
                    type: string
                required:
                - status
                - id
