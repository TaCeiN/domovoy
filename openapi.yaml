  /api/requests/{id}/files:
    post:
      tags:
      - Обращения
      summary: Приложить файл
      description: Фото или PDF до 10 МБ, до пяти на обращение. Тип определяется по содержимому.
      operationId: post_api_requests_id_files
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  file:
                    type: object
                    properties:
                      ok:
                        type:
                        - boolean
                        - 'null'
                      id:
                        type: string
                      mime:
                        type:
                        - string
                        - 'null'
                      sizeBytes:
                        type:
                        - number
                        - 'null'
                      originalName:
                        type:
                        - string
                        - 'null'
                    required:
                    - ok
                    - id
                    - mime
                    - sizeBytes
                    - originalName
                required:
                - status
                - file
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Конфликт состояния
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Неподдерживаемый тип файла
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/requests/{id}/files/{fileId}:
    get:
      tags:
      - Обращения
      summary: Скачать вложение
      description: Только тому, кому видно само обращение.
      operationId: get_api_requests_id_files_fileId
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: fileId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Успех
          content:
            image/png:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/requests/{id}/rating:
    post:
      tags:
      - Обращения
      summary: Оценить выполненное
      description: Оценка 1–5 после закрытия.
      operationId: post_api_requests_id_rating
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
