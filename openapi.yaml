        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Токен сессии из /api/auth/qr, /api/auth/max, /api/demo/roles/{key}/take или /api/dispatcher/login
    cookieAuth:
      type: apiKey
      in: cookie
      name: zd_session
      description: Та же сессия в cookie — её ставит сервер при входе
  parameters:
    MaxInitData:
      name: X-Max-Init-Data
      in: header
      required: false
      schema:
        type: string
      description: Подписанная строка initData мини-приложения MAX (WebApp.initData). Проверяется подпись токеном
        бота.
  schemas:
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: string
          description: Машинный код ошибки
        message:
          type: string
          description: Понятный человеку текст
  responses:
    Unauthorized:
      description: Нужен вход
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
